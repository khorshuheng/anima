syntax = "proto3";

package anima.bus.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Anima.Contracts.Bus.V1";

// Delegation request emitted by an orchestrator to a worker agent.
message TaskAssignment {
  string task_id = 1;
  string goal_id = 2;
  string title = 3;
  string instructions = 4;
  repeated string capabilities = 5;
  google.protobuf.Struct context = 6;
  google.protobuf.Timestamp deadline = 7;
}

// Outcome reported back to the delegating agent.
message TaskResult {
  string task_id = 1;
  string agent_id = 2;
  TaskStatus status = 3;
  string summary = 4;
  google.protobuf.Struct artifacts = 5;
  repeated string follow_ups = 6;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_SUCCEEDED = 1;
  TASK_STATUS_FAILED = 2;
  TASK_STATUS_BLOCKED = 3;
  TASK_STATUS_CANCELLED = 4;
}

// Free-form agent-to-agent note that is not a task.
message AgentNote {
  string agent_id = 1;
  string subject = 2;
  string body = 3;
  repeated string related_node_ids = 4;
}
