syntax = "proto3";

package anima.knowledge.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Anima.Contracts.Knowledge.V1";

// A node in the knowledge graph. Tasks and long-term memories share this shape.
message Node {
  int64 id = 1;
  string kind = 2;
  string name = 3;
  string description = 4;
  string content = 5;
  google.protobuf.Struct properties = 6;
  bool resolved = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Edge {
  int64 id = 1;
  int64 source = 2;
  int64 destination = 3;
  string edge_type = 4;
}

// Published on the bus whenever the graph changes.
message GraphChanged {
  string change = 1;
  Node node = 2;
  Edge edge = 3;
  string session_id = 4;
}
