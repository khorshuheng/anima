syntax = "proto3";

package anima.automation.v1;

option csharp_namespace = "Anima.Contracts.Automation.V1";

// Request to execute a derived UI script against a browser session.
message ScriptRequest {
  string run_id = 1;
  string script_name = 2;
  string format = 3;
  string source = 4;
  string base_url = 5;
  map<string, string> variables = 6;
  bool stop_on_error = 7;
}

message ScriptStepResult {
  int32 index = 1;
  string action = 2;
  bool success = 3;
  int64 duration_ms = 4;
  string output = 5;
  string error = 6;
}

message ScriptResult {
  string run_id = 1;
  string script_name = 2;
  bool success = 3;
  repeated ScriptStepResult steps = 4;
  map<string, string> variables = 5;
  string error = 6;
}

message SessionEvent {
  string session_id = 1;
  string kind = 2;
  string url = 3;
  string detail = 4;
}
