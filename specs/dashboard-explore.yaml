name: dashboard-explore
description: Browse goals and facts from the Graph tab and verify completion filtering.
steps:
  - goto: /
  - click: "button.tab:has-text('Graph')"
  - waitFor: { target: "h2:has-text('Knowledge graph')" }
  - waitFor: { target: "[data-testid=graph-results-ready]" }
  - waitForText: { target: "[data-testid=graph-results-ready]", text: "7 of 7" }
  - eval: "document.querySelector('[data-testid=graph-results-ready]').getAttribute('data-result-count')"
  - select: { target: "[data-testid=graph-scope]", value: "resolved" }
  - waitForText: { target: "[data-testid=graph-results-ready]", text: "4 of 4" }
  - eval: "document.querySelector('[data-testid=graph-results-ready]').getAttribute('data-result-count')"
  - fill: { target: "[data-testid=graph-search]", value: "orchestration" }
  - click: "[data-testid=graph-search-submit]"
  - waitForText: { target: "[data-testid=graph-results-ready]", text: "1 of 1" }
  - eval: "document.querySelector('[data-testid=graph-results-ready]').getAttribute('data-result-count')"
  - eval: "document.querySelector('[data-testid=graph-kinds]').textContent.includes('goal')"
  - click: "[data-testid^=graph-result-]"
  - waitFor: { target: ".inspector-heading" }
  - eval: "document.querySelector('.inspector-heading').textContent"
  - screenshot: /tmp/anima-dashboard-explore.png
