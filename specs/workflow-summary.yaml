name: workflow-summary
description: Verify the workflow run summary, review iterations and evidence fields.
steps:
  - goto: /
  - click: "[data-testid=workflow-item-172]"
  - waitFor: { target: "[data-testid=workflow-summary]" }
  - waitForText: { target: "[data-testid=workflow-summary]", text: "Review #1" }
  - eval: "document.querySelectorAll('[data-testid^=review-iteration-]').length"
  - eval: "document.querySelector('[data-testid=workflow-summary]').textContent.includes('recorded agents')"
  - eval: "document.querySelector('.result-list')?.textContent.includes('head 6620278') ?? false"
  - screenshot: /tmp/anima-workflow-summary.png
